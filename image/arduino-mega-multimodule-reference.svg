<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Arduino Mega Multi Module Project Reference</title>
  <desc id="desc">Diagram showing Arduino Mega connected to multiple sensors, motor driver, display, relay, and communication modules.</desc>
  <rect width="1100" height="620" rx="28" fill="#071014"/>
  <text x="550" y="76" fill="#f6fbff" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" text-anchor="middle">Mega for Large Projects</text>
  <text x="550" y="112" fill="#b6cedc" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle">Many pins allow several sensors, displays, motors, and modules at the same time</text>

  <g transform="translate(420 220)">
    <rect width="260" height="170" rx="20" fill="#0b4f8a" stroke="#7dd3fc" stroke-width="4"/>
    <rect x="70" y="48" width="120" height="68" rx="8" fill="#111827" stroke="#94a3b8" stroke-width="2"/>
    <text x="130" y="150" fill="#f8fbff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">Arduino Mega</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    <rect x="70" y="170" width="190" height="78" rx="15" fill="#102b45" stroke="#ffd166" stroke-width="3"/><text x="165" y="217" fill="#f8fbff">Sensors</text>
    <rect x="70" y="360" width="190" height="78" rx="15" fill="#102b45" stroke="#2dd4bf" stroke-width="3"/><text x="165" y="407" fill="#f8fbff">LCD / OLED</text>
    <rect x="455" y="470" width="190" height="78" rx="15" fill="#102b45" stroke="#4da3ff" stroke-width="3"/><text x="550" y="517" fill="#f8fbff">Motor Driver</text>
    <rect x="840" y="170" width="190" height="78" rx="15" fill="#102b45" stroke="#ef4444" stroke-width="3"/><text x="935" y="217" fill="#f8fbff">Relay Module</text>
    <rect x="840" y="360" width="190" height="78" rx="15" fill="#102b45" stroke="#a78bfa" stroke-width="3"/><text x="935" y="407" fill="#f8fbff">GPS / Bluetooth</text>
  </g>

  <g stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M260 209 C335 220 370 255 420 278" stroke="#ffd166"/>
    <path d="M260 399 C338 382 370 345 420 333" stroke="#2dd4bf"/>
    <path d="M550 390 V470" stroke="#4da3ff"/>
    <path d="M680 278 C755 230 790 215 840 209" stroke="#ef4444"/>
    <path d="M680 333 C755 360 790 388 840 399" stroke="#a78bfa"/>
  </g>

  <rect x="272" y="546" width="556" height="36" rx="18" fill="#0f766e"/>
  <text x="550" y="570" fill="#ecfeff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Use motor drivers and relays for high-current loads, not direct pins</text>
</svg>
