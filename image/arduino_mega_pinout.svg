<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Arduino Mega pinout</title>
  <desc id="desc">Arduino Mega pin groups including 54 digital pins, 16 analog pins, PWM, serial, I2C, and SPI.</desc>
  <rect width="1200" height="620" fill="#07131f"/>
  <rect x="150" y="135" width="900" height="350" rx="32" fill="#0d5b78" stroke="#39d3c7" stroke-width="5"/>
  <text x="600" y="210" text-anchor="middle" fill="#ffffff" font-size="48" font-family="Arial">Arduino Mega Pinout</text>
  <text x="600" y="268" text-anchor="middle" fill="#d8f7ff" font-size="27" font-family="Arial">ATmega2560 • 54 digital pins • 16 analog pins</text>
  <g fill="#ffffff" font-family="Arial" font-size="23">
    <text x="82" y="102">Digital: D0-D53</text>
    <text x="82" y="535">Analog: A0-A15</text>
    <text x="760" y="102">PWM: D2-D13, D44-D46</text>
    <text x="725" y="535">SPI: D50 MISO, D51 MOSI, D52 SCK, D53 SS</text>
    <text x="270" y="575">Serial: 0/1, 18/19, 16/17, 14/15 • I2C: D20 SDA / D21 SCL</text>
  </g>
  <g fill="#d8f7ff">
    <rect x="165" y="95" width="870" height="24" rx="8"/>
    <rect x="165" y="500" width="420" height="24" rx="8"/>
    <rect x="1065" y="185" width="24" height="220" rx="8"/>
  </g>
</svg>
