<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Fusion vase modeling reference</title>
  <desc id="desc">Reference diagram for sketching, revolving, shelling, and completing a vase model in Fusion.</desc>
  <rect width="1200" height="650" fill="#07131f"/>
  <text x="600" y="72" text-anchor="middle" fill="#ffffff" font-size="42" font-family="Arial">Fusion Vase Modeling Steps</text>
  <g font-family="Arial">
    <rect x="80" y="135" width="210" height="360" rx="20" fill="#10253a" stroke="#7df9ff" stroke-width="4"/>
    <text x="185" y="190" text-anchor="middle" fill="#ffffff" font-size="28">Sketch</text>
    <path d="M180 430 C120 350 130 260 185 220 C240 260 250 350 190 430 Z" fill="none" stroke="#7df9ff" stroke-width="6"/>
    <rect x="355" y="135" width="210" height="360" rx="20" fill="#10253a" stroke="#39d3c7" stroke-width="4"/>
    <text x="460" y="190" text-anchor="middle" fill="#ffffff" font-size="28">Profile</text>
    <path d="M460 430 C405 350 420 255 460 220" fill="none" stroke="#39d3c7" stroke-width="7"/>
    <line x1="460" y1="220" x2="460" y2="430" stroke="#ffffff" stroke-width="3"/>
    <rect x="630" y="135" width="210" height="360" rx="20" fill="#10253a" stroke="#f5b84b" stroke-width="4"/>
    <text x="735" y="190" text-anchor="middle" fill="#ffffff" font-size="28">Revolve</text>
    <ellipse cx="735" cy="330" rx="70" ry="150" fill="none" stroke="#f5b84b" stroke-width="7"/>
    <path d="M675 270 C735 220 795 270 735 320 C675 370 795 410 735 455" fill="none" stroke="#ffffff" stroke-width="4"/>
    <rect x="905" y="135" width="210" height="360" rx="20" fill="#10253a" stroke="#ff7d6e" stroke-width="4"/>
    <text x="1010" y="190" text-anchor="middle" fill="#ffffff" font-size="28">Shell</text>
    <path d="M945 430 C900 350 915 250 1010 220 C1105 250 1120 350 1075 430 Z" fill="none" stroke="#ff7d6e" stroke-width="7"/>
    <path d="M980 420 C945 350 960 280 1010 255 C1060 280 1075 350 1040 420 Z" fill="none" stroke="#ffffff" stroke-width="4"/>
    <text x="600" y="585" text-anchor="middle" fill="#d8f7ff" font-size="30">Sketch profile -> Revolve body -> Shell inside -> Finish model</text>
  </g>
</svg>
