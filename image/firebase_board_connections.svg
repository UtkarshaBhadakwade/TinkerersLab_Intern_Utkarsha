<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Direct vs. Indirect Firebase Connections</title>
  <desc id="desc">Visual comparison showing how ESP32 connects directly to Firebase via built-in Wi-Fi, while Arduino Uno requires an external ESP8266 module to communicate.</desc>
  <rect width="1200" height="650" rx="16" fill="#071014"/>
  
  <defs>
    <!-- Background Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f58220"/>
    </marker>
  </defs>
  
  <rect width="1200" height="650" fill="url(#grid)" rx="16"/>

  <!-- Title -->
  <text x="600" y="70" text-anchor="middle" fill="#f6fbff" font-size="38" font-family="Arial, sans-serif" font-weight="bold">Firebase Connection Methods</text>
  <text x="600" y="105" text-anchor="middle" fill="rgba(246, 251, 255, 0.72)" font-size="18" font-family="Arial, sans-serif">Direct cloud connection using Wi-Fi SOCs vs. Indirect bridging for basic microcontrollers</text>

  <!-- Right: Common Firebase Cloud (Shared destination) -->
  <g transform="translate(930, 240)">
    <rect width="200" height="240" rx="16" fill="#132435" stroke="#f58220" stroke-width="3" filter="url(#glow)"/>
    <!-- Firebase Icon -->
    <path d="M 100 50 L 140 120 L 100 145 L 60 120 Z" fill="#ffd166" fill-opacity="0.15"/>
    <path d="M 100 60 L 70 115 L 100 132 Z" fill="#ffca28"/>
    <path d="M 100 60 L 130 115 L 100 132 Z" fill="#f58220"/>
    <path d="M 100 50 L 85 110 L 100 122 Z" fill="#ffa000"/>
    
    <text x="100" y="170" text-anchor="middle" fill="#f6fbff" font-family="Arial, sans-serif" font-weight="bold" font-size="20">Firebase</text>
    <text x="100" y="195" text-anchor="middle" fill="#f58220" font-family="Arial, sans-serif" font-weight="bold" font-size="12">RTDB / FIRESTORE</text>
    <text x="100" y="215" text-anchor="middle" fill="rgba(246, 251, 255, 0.6)" font-family="Arial, sans-serif" font-size="11">Google Cloud Platform</text>
  </g>

  <!-- Method A: DIRECT CONNECTION -->
  <g transform="translate(60, 140)">
    <rect width="760" height="200" rx="12" fill="#0d1b24" stroke="#20d6b5" stroke-width="2"/>
    <rect width="760" height="200" rx="12" fill="none" stroke="#20d6b5" stroke-width="4" opacity="0.1" filter="url(#glow)"/>
    
    <text x="30" y="38" fill="#f6fbff" font-family="Arial, sans-serif" font-weight="bold" font-size="20">Method A: Direct Connection (ESP32 / ESP8266)</text>
    
    <!-- ESP32 Board Graphic -->
    <g transform="translate(40, 60)">
      <rect width="160" height="100" rx="8" fill="#111827" stroke="#2dd4bf" stroke-width="2"/>
      <rect x="15" y="15" width="80" height="70" rx="4" fill="#1f2937"/>
      <text x="55" y="55" text-anchor="middle" fill="#20d6b5" font-family="Arial, sans-serif" font-weight="bold" font-size="13">ESP32 SoC</text>
      <!-- Onboard Antenna -->
      <path d="M 115 20 L 145 20 V 80 H 115" fill="none" stroke="#ffd166" stroke-width="3"/>
      <text x="130" y="55" text-anchor="middle" fill="#ffd166" font-family="Arial, sans-serif" font-size="10" font-weight="bold" transform="rotate(90,130,55)">Wi-Fi</text>
    </g>

    <!-- Connective arrow -->
    <path d="M 230 110 L 730 110" stroke="#20d6b5" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
    <text x="480" y="95" text-anchor="middle" fill="#20d6b5" font-family="Arial, sans-serif" font-weight="bold" font-size="13">Direct SSL Handshake over Wi-Fi (No bridges needed)</text>

    <!-- Details -->
    <g transform="translate(240, 135)" fill="rgba(246, 251, 255, 0.75)" font-family="Arial, sans-serif" font-size="13">
      <circle cx="10" cy="-2" r="3.5" fill="#20d6b5"/>
      <text x="25" y="2">Uses Firebase Client Libraries directly</text>
      <circle cx="340" cy="-2" r="3.5" fill="#20d6b5"/>
      <text x="355" y="2">High processing power (dual core)</text>
      <circle cx="590" cy="-2" r="3.5" fill="#20d6b5"/>
      <text x="605" y="2">Low wiring latency</text>
    </g>
  </g>

  <!-- Method B: INDIRECT CONNECTION -->
  <g transform="translate(60, 380)">
    <rect width="760" height="230" rx="12" fill="#0d1b24" stroke="#4da3ff" stroke-width="2"/>
    <rect width="760" height="230" rx="12" fill="none" stroke="#4da3ff" stroke-width="4" opacity="0.1" filter="url(#glow)"/>
    
    <text x="30" y="38" fill="#f6fbff" font-family="Arial, sans-serif" font-weight="bold" font-size="20">Method B: Indirect Connection (Arduino Uno / Nano / Mega + Module)</text>

    <!-- Arduino Board Graphic -->
    <g transform="translate(30, 60)">
      <rect width="110" height="100" rx="8" fill="#153e5e" stroke="#4da3ff" stroke-width="2"/>
      <rect x="25" y="25" width="60" height="50" rx="4" fill="#0c2538"/>
      <text x="55" y="55" text-anchor="middle" fill="#4da3ff" font-family="Arial, sans-serif" font-weight="bold" font-size="13">Arduino</text>
    </g>

    <!-- Serial wires -->
    <path d="M 145 95 L 195 95" stroke="#ef4444" stroke-width="3" fill="none"/>
    <path d="M 145 115 L 195 115" stroke="#3b82f6" stroke-width="3" fill="none"/>
    <text x="170" y="85" text-anchor="middle" fill="#f6fbff" font-family="Arial, sans-serif" font-size="10" font-weight="bold">TX/RX</text>

    <!-- ESP-01 Transceiver Module -->
    <g transform="translate(200, 75)">
      <rect width="80" height="70" rx="4" fill="#1e293b" stroke="#ffd166" stroke-width="1.5"/>
      <rect x="8" y="8" width="22" height="22" fill="#000" stroke="#94a3b8"/>
      <text x="40" y="45" text-anchor="middle" fill="#ffd166" font-family="Arial, sans-serif" font-weight="bold" font-size="11">ESP-01</text>
      <!-- Pins -->
      <circle cx="55" cy="15" r="2" fill="#ffd166"/>
      <circle cx="65" cy="15" r="2" fill="#ffd166"/>
      <circle cx="55" cy="25" r="2" fill="#ffd166"/>
      <circle cx="65" cy="25" r="2" fill="#ffd166"/>
    </g>

    <!-- Connective arrow -->
    <path d="M 285 110 L 730 110" stroke="#ffd166" stroke-width="5" fill="none" stroke-dasharray="10,4" marker-end="url(#arrow)"/>
    <text x="500" y="95" text-anchor="middle" fill="#ffd166" font-family="Arial, sans-serif" font-weight="bold" font-size="13">AT Commands / Serial Transceiver Bridge</text>

    <!-- Details -->
    <g transform="translate(20, 165)" fill="rgba(246, 251, 255, 0.75)" font-family="Arial, sans-serif" font-size="13">
      <circle cx="10" cy="-2" r="3.5" fill="#4da3ff"/>
      <text x="25" y="2">Arduino reads sensor variables locally</text>
      <circle cx="280" cy="-2" r="3.5" fill="#4da3ff"/>
      <text x="295" y="2">Sends serial print payload to ESP8266 bridge</text>
      <circle cx="585" cy="-2" r="3.5" fill="#4da3ff"/>
      <text x="600" y="2">Limited RAM on Arduino Uno for secure SSL</text>
    </g>
  </g>

</svg>
