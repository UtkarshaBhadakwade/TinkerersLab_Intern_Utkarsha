<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">IoT Board Selection Reference</title>
  <desc id="desc">Comparison-style diagram showing Arduino Uno, Arduino Nano IoT, and ESP32 for IoT board selection.</desc>
  <rect width="1100" height="620" rx="28" fill="#08131f"/>
  <rect x="36" y="36" width="1028" height="548" rx="22" fill="#0e2135" stroke="#2dd4bf" stroke-width="3"/>
  <text x="550" y="90" fill="#f8fbff" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" text-anchor="middle">Choose the Right IoT Board</text>
  <text x="550" y="128" fill="#a9c7d8" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle">Pick hardware based on connectivity, project size, and cloud requirements</text>

  <g transform="translate(84 182)">
    <rect width="286" height="330" rx="18" fill="#102b45" stroke="#4da3ff" stroke-width="2"/>
    <rect x="78" y="50" width="130" height="88" rx="10" fill="#1d4ed8" stroke="#93c5fd" stroke-width="3"/>
    <circle cx="102" cy="74" r="7" fill="#dbeafe"/>
    <circle cx="184" cy="74" r="7" fill="#dbeafe"/>
    <rect x="100" y="152" width="86" height="18" rx="4" fill="#93c5fd"/>
    <text x="143" y="220" fill="#f8fbff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">Arduino Uno</text>
    <text x="143" y="258" fill="#cfe7f5" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">Good for basics</text>
    <text x="143" y="286" fill="#cfe7f5" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">Needs Wi-Fi module</text>
  </g>

  <g transform="translate(407 182)">
    <rect width="286" height="330" rx="18" fill="#102b45" stroke="#ffd166" stroke-width="2"/>
    <rect x="103" y="40" width="80" height="120" rx="14" fill="#0f766e" stroke="#99f6e4" stroke-width="3"/>
    <circle cx="123" cy="64" r="5" fill="#ccfbf1"/>
    <circle cx="163" cy="64" r="5" fill="#ccfbf1"/>
    <path d="M111 126h64" stroke="#ccfbf1" stroke-width="5" stroke-linecap="round"/>
    <text x="143" y="220" fill="#f8fbff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">Nano IoT</text>
    <text x="143" y="258" fill="#cfe7f5" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">Compact board</text>
    <text x="143" y="286" fill="#cfe7f5" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">Built-in wireless</text>
  </g>

  <g transform="translate(730 182)">
    <rect width="286" height="330" rx="18" fill="#102b45" stroke="#2dd4bf" stroke-width="4"/>
    <rect x="82" y="44" width="122" height="118" rx="12" fill="#111827" stroke="#2dd4bf" stroke-width="3"/>
    <rect x="110" y="72" width="66" height="46" rx="6" fill="#334155"/>
    <path d="M115 138h56" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round"/>
    <path d="M205 70c28 15 43 39 43 72M221 100c12 9 19 23 19 42" fill="none" stroke="#ffd166" stroke-width="5" stroke-linecap="round"/>
    <text x="143" y="220" fill="#f8fbff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">ESP32</text>
    <text x="143" y="258" fill="#cfe7f5" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">Best for IoT</text>
    <text x="143" y="286" fill="#cfe7f5" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">Wi-Fi + Bluetooth</text>
  </g>

  <rect x="330" y="536" width="440" height="34" rx="17" fill="#0f766e"/>
  <text x="550" y="559" fill="#ecfeff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle">For cloud projects, ESP32 is the practical choice</text>
</svg>
