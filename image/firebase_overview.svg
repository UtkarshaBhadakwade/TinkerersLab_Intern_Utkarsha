<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Firebase Core Services for IoT</title>
  <desc id="desc">Visual diagram showing key Google Firebase cloud components like Realtime Database, Firestore, Authentication, Hosting, and Cloud Functions used in IoT projects.</desc>
  <rect width="1200" height="680" rx="16" fill="#071014"/>
  
  <defs>
    <!-- Background Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
    <!-- Radial Glows -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f58220" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f58220" stop-opacity="0"/>
    </radialGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="1200" height="680" fill="url(#grid)" rx="16"/>
  <circle cx="600" cy="340" r="320" fill="url(#centerGlow)"/>

  <!-- Title -->
  <text x="600" y="70" text-anchor="middle" fill="#f6fbff" font-size="38" font-family="Arial, sans-serif" font-weight="bold">Firebase IoT Ecosystem</text>
  <text x="600" y="105" text-anchor="middle" fill="rgba(246, 251, 255, 0.72)" font-size="18" font-family="Arial, sans-serif">Google Cloud services tailored for real-time hardware telemetry and remote control</text>

  <!-- Connection Lines (Center to Cards) -->
  <g stroke="rgba(245, 130, 32, 0.3)" stroke-width="3" fill="none" stroke-dasharray="6,4">
    <!-- Line to Realtime DB -->
    <path d="M 600 340 L 220 200"/>
    <!-- Line to Firestore -->
    <path d="M 600 340 L 220 480"/>
    <!-- Line to Auth -->
    <path d="M 600 340 L 980 200"/>
    <!-- Line to Hosting -->
    <path d="M 600 340 L 980 480"/>
    <!-- Line to Functions -->
    <path d="M 600 340 L 600 150"/>
  </g>

  <!-- Central Firebase Hub -->
  <g transform="translate(600, 340)">
    <circle cx="0" cy="0" r="85" fill="#132435" stroke="#f58220" stroke-width="4" filter="url(#glow)"/>
    <!-- Firebase Logo (Simplified Icon) -->
    <path d="M -24 -36 L 24 -36 L 36 28 L 0 46 L -36 28 Z" fill="#182c3f"/>
    <!-- Left wing -->
    <path d="M 0 -26 L -24 20 L -6 26 Z" fill="#ffca28"/>
    <!-- Right wing -->
    <path d="M 0 -26 L 24 20 L 6 26 Z" fill="#f58220"/>
    <!-- Front overlay -->
    <path d="M 0 -34 L -12 12 L 0 20 L 12 12 Z" fill="#ffa000"/>
    <text x="0" y="62" text-anchor="middle" fill="#f6fbff" font-family="Arial, sans-serif" font-weight="bold" font-size="16" letter-spacing="1">FIREBASE</text>
  </g>

  <!-- Service Cards -->
  
  <!-- 1. Realtime Database (Top-Left) -->
  <g transform="translate(70, 120)">
    <rect width="300" height="150" rx="12" fill="#0c1b24" stroke="#4da3ff" stroke-width="2.5"/>
    <rect width="300" height="150" rx="12" fill="none" stroke="#4da3ff" stroke-width="6" opacity="0.1" filter="url(#glow)"/>
    <!-- Database Icon -->
    <g transform="translate(30, 40)" fill="none" stroke="#4da3ff" stroke-width="2.5">
      <ellipse cx="20" cy="12" rx="16" ry="6"/>
      <path d="M 4 12 L 4 22 A 16 6 0 0 0 36 22 L 36 12"/>
      <path d="M 4 22 L 4 32 A 16 6 0 0 0 36 32 L 36 22"/>
    </g>
    <text x="80" y="46" fill="#f6fbff" font-family="Arial, sans-serif" font-weight="bold" font-size="20">Realtime Database</text>
    <text x="80" y="68" fill="#4da3ff" font-family="Arial, sans-serif" font-weight="bold" font-size="12">RECOMMENDED FOR IOT</text>
    <text x="25" y="98" fill="rgba(246, 251, 255, 0.75)" font-family="Arial, sans-serif" font-size="14">
      <tspan x="25" dy="0">Stores data as a single JSON tree.</tspan>
      <tspan x="25" dy="20">Syncs sensor readings and relay status</tspan>
      <tspan x="25" dy="20">instantly (in milliseconds) without polling.</tspan>
    </text>
  </g>

  <!-- 2. Cloud Firestore (Bottom-Left) -->
  <g transform="translate(70, 410)">
    <rect width="300" height="150" rx="12" fill="#0c1b24" stroke="#ffcb3f" stroke-width="2.5"/>
    <rect width="300" height="150" rx="12" fill="none" stroke="#ffcb3f" stroke-width="6" opacity="0.1" filter="url(#glow)"/>
    <!-- Document Stack Icon -->
    <g transform="translate(30, 40)" fill="none" stroke="#ffcb3f" stroke-width="2.5">
      <rect x="6" y="14" width="22" height="26" rx="2"/>
      <line x1="11" y1="21" x2="23" y2="21"/>
      <line x1="11" y1="28" x2="23" y2="28"/>
      <line x1="11" y1="34" x2="19" y2="34"/>
      <path d="M 12 8 L 32 8 L 32 34" stroke-dasharray="3,3"/>
    </g>
    <text x="80" y="46" fill="#f6fbff" font-family="Arial, sans-serif" font-weight="bold" font-size="20">Cloud Firestore</text>
    <text x="80" y="68" fill="#ffcb3f" font-family="Arial, sans-serif" font-weight="bold" font-size="12">DOCUMENTS &amp; COLLECTIONS</text>
    <text x="25" y="98" fill="rgba(246, 251, 255, 0.75)" font-family="Arial, sans-serif" font-size="14">
      <tspan x="25" dy="0">Structured document database model.</tspan>
      <tspan x="25" dy="20">Best for complex queries, history storage,</tspan>
      <tspan x="25" dy="20">user roles, and multi-device networks.</tspan>
    </text>
  </g>

  <!-- 3. Cloud Functions (Top-Center) -->
  <g transform="translate(450, 20)">
    <rect width="300" height="100" rx="12" fill="#0c1b24" stroke="#ff5722" stroke-width="2.5"/>
    <!-- Lightning Bolt Icon -->
    <path d="M 478 40 L 468 62 L 478 62 L 472 88 L 488 56 L 478 56 Z" fill="none" stroke="#ff5722" stroke-width="2.5"/>
    <text x="60" y="38" fill="#f6fbff" font-family="Arial, sans-serif" font-weight="bold" font-size="18">Cloud Functions</text>
    <text x="60" y="56" fill="#ff5722" font-family="Arial, sans-serif" font-weight="bold" font-size="11">SERVERLESS LOGIC</text>
    <text x="20" y="80" fill="rgba(246, 251, 255, 0.75)" font-family="Arial, sans-serif" font-size="13">Runs backend code when sensor thresholds are</text>
    <text x="20" y="96" fill="rgba(246, 251, 255, 0.75)" font-family="Arial, sans-serif" font-size="13">exceeded (e.g., send warning email/alert).</text>
  </g>

  <!-- 4. Authentication (Top-Right) -->
  <g transform="translate(830, 120)">
    <rect width="300" height="150" rx="12" fill="#0c1b24" stroke="#20d6b5" stroke-width="2.5"/>
    <rect width="300" height="150" rx="12" fill="none" stroke="#20d6b5" stroke-width="6" opacity="0.1" filter="url(#glow)"/>
    <!-- Lock/Shield Icon -->
    <g transform="translate(30, 40)" fill="none" stroke="#20d6b5" stroke-width="2.5">
      <rect x="6" y="18" width="28" height="22" rx="4"/>
      <path d="M 12 18 V 11 A 8 8 0 0 1 28 11 V 18"/>
      <circle cx="20" cy="28" r="3" fill="#20d6b5"/>
    </g>
    <text x="80" y="46" fill="#f6fbff" font-family="Arial, sans-serif" font-weight="bold" font-size="20">Authentication</text>
    <text x="80" y="68" fill="#20d6b5" font-family="Arial, sans-serif" font-weight="bold" font-size="12">SECURITY PROTOCOLS</text>
    <text x="25" y="98" fill="rgba(246, 251, 255, 0.75)" font-family="Arial, sans-serif" font-size="14">
      <tspan x="25" dy="0">Keeps dashboard and API paths safe.</tspan>
      <tspan x="25" dy="20">Restricts ESP32 data uploads and user</tspan>
      <tspan x="25" dy="20">panel dashboard to authorized logins.</tspan>
    </text>
  </g>

  <!-- 5. Hosting (Bottom-Right) -->
  <g transform="translate(830, 410)">
    <rect width="300" height="150" rx="12" fill="#0c1b24" stroke="#a166ff" stroke-width="2.5"/>
    <rect width="300" height="150" rx="12" fill="none" stroke="#a166ff" stroke-width="6" opacity="0.1" filter="url(#glow)"/>
    <!-- Web/Globe Icon -->
    <g transform="translate(30, 40)" fill="none" stroke="#a166ff" stroke-width="2.5">
      <circle cx="20" cy="20" r="16"/>
      <ellipse cx="20" cy="20" rx="6" ry="16"/>
      <line x1="4" y1="20" x2="36" y2="20"/>
    </g>
    <text x="80" y="46" fill="#f6fbff" font-family="Arial, sans-serif" font-weight="bold" font-size="20">Firebase Hosting</text>
    <text x="80" y="68" fill="#a166ff" font-family="Arial, sans-serif" font-weight="bold" font-size="12">WEB SERVER &amp; CDN</text>
    <text x="25" y="98" fill="rgba(246, 251, 255, 0.75)" font-family="Arial, sans-serif" font-size="14">
      <tspan x="25" dy="0">Fast web hosting for custom interfaces.</tspan>
      <tspan x="25" dy="20">Deploys standard HTML, CSS, JS web</tspan>
      <tspan x="25" dy="20">dashboards to a global CDN secure link.</tspan>
    </text>
  </g>

  <!-- Footer Info Banner -->
  <g transform="translate(250, 600)">
    <rect width="700" height="42" fill="rgba(32, 214, 181, 0.06)" rx="8" stroke="rgba(32, 214, 181, 0.15)" stroke-width="1.5"/>
    <text x="350" y="26" text-anchor="middle" fill="#20d6b5" font-family="Arial, sans-serif" font-size="14" font-weight="bold">ESP32 typically queries/streams the Realtime DB while the front-end dashboard reads &amp; displays it.</text>
  </g>
</svg>
