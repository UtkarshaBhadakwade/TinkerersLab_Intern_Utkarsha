<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Firebase IoT reference</title>
  <desc id="desc">ESP32 and sensors send data to Firebase and a dashboard reads it.</desc>
  <rect width="1200" height="680" fill="#07131f"/>
  <text x="600" y="70" text-anchor="middle" fill="#ffffff" font-size="42" font-family="Arial">Firebase IoT Data Sharing</text>
  <g font-family="Arial">
    <rect x="70" y="160" width="220" height="140" rx="20" fill="#10253a" stroke="#39d3c7" stroke-width="4"/>
    <text x="180" y="220" text-anchor="middle" fill="#ffffff" font-size="30">Sensors</text>
    <text x="180" y="260" text-anchor="middle" fill="#b8d8e6" font-size="20">DHT • LDR • PIR</text>
    <rect x="380" y="160" width="220" height="140" rx="20" fill="#164860" stroke="#f5b84b" stroke-width="4"/>
    <text x="490" y="220" text-anchor="middle" fill="#ffffff" font-size="30">ESP32</text>
    <text x="490" y="260" text-anchor="middle" fill="#ffe9bf" font-size="20">Reads pins + Wi-Fi</text>
    <rect x="690" y="160" width="220" height="140" rx="20" fill="#3a2b08" stroke="#ffcb3f" stroke-width="4"/>
    <text x="800" y="220" text-anchor="middle" fill="#ffffff" font-size="30">Firebase</text>
    <text x="800" y="260" text-anchor="middle" fill="#fff0b8" font-size="20">Realtime Database</text>
    <rect x="470" y="430" width="260" height="150" rx="20" fill="#10253a" stroke="#7df9ff" stroke-width="4"/>
    <text x="600" y="492" text-anchor="middle" fill="#ffffff" font-size="30">Dashboard</text>
    <text x="600" y="535" text-anchor="middle" fill="#b8d8e6" font-size="20">Web / Mobile App</text>
    <path d="M300 230 H370" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
    <path d="M370 230 l-24 -16 v32 z" fill="#ffffff"/>
    <path d="M610 230 H680" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
    <path d="M680 230 l-24 -16 v32 z" fill="#ffffff"/>
    <path d="M800 310 C800 390 715 430 650 430" stroke="#ffffff" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M650 430 l24 -18 v34 z" fill="#ffffff"/>
    <text x="1000" y="210" fill="#ffffff" font-size="24">/sensor/temperature</text>
    <text x="1000" y="250" fill="#ffffff" font-size="24">/sensor/humidity</text>
    <text x="1000" y="290" fill="#ffffff" font-size="24">/control/relay</text>
  </g>
</svg>
