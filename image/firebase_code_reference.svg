<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">ESP32 Firebase code reference</title>
  <desc id="desc">Reference image showing code structure for sending ESP32 sensor data to Firebase.</desc>
  <rect width="1200" height="700" fill="#07131f"/>
  <rect x="90" y="80" width="1020" height="540" rx="22" fill="#0b1b2a" stroke="#7df9ff" stroke-width="4"/>
  <rect x="90" y="80" width="1020" height="64" rx="22" fill="#10253a"/>
  <text x="130" y="122" fill="#ffffff" font-size="28" font-family="Arial">ESP32_Firebase_Sensor.ino</text>
  <g font-family="Consolas, monospace" font-size="28">
    <text x="135" y="205" fill="#7df9ff">1</text><text x="185" y="205" fill="#ffffff">Connect ESP32 to Wi-Fi</text>
    <text x="135" y="260" fill="#7df9ff">2</text><text x="185" y="260" fill="#ffffff">Start Firebase using project URL and token</text>
    <text x="135" y="315" fill="#7df9ff">3</text><text x="185" y="315" fill="#ffffff">Read sensor value from GPIO pin</text>
    <text x="135" y="370" fill="#7df9ff">4</text><text x="185" y="370" fill="#ffffff">Upload value to /sensor/value</text>
    <text x="135" y="425" fill="#7df9ff">5</text><text x="185" y="425" fill="#ffffff">Read /control/relay for ON/OFF control</text>
    <text x="135" y="505" fill="#f5b84b">Firebase.setInt(firebaseData, "/sensor/value", sensorValue);</text>
  </g>
</svg>
